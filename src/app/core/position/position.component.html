<div style="margin: 20px;">
    <div class="header">
      <h2>Positions</h2>
      <div class="custom_input">
        <button class="addBtn" (click)="openAddPositionModal()">Add</button>
        <div class="custom_input">
          <mat-icon class="svg_icon bi-search">search</mat-icon>
          <input
            class="input"
            type="text"
            placeholder="Search positions"
            (input)="applyFilter($event)"
          />
        </div>
      </div>
    </div>
  
    <table mat-table [dataSource]="positions" class="mat-elevation-z8">
        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef> Position </th>
          <td mat-cell *matCellDef="let element"> {{ element.position }} </td>
        </ng-container>
      
        <ng-container matColumnDef="max_vote">
          <th mat-header-cell *matHeaderCellDef> Max Vote </th>
          <td mat-cell *matCellDef="let element"> {{ element.max_vote }} </td>
        </ng-container>
      
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let element">
              <button mat-button (click)="editPosition(element.position_id)" class="editBtn">Edit</button>
            <button mat-button (click)="deletePosition(element.position_id)" class="deleteBtn">Delete</button>
          </td>
        </ng-container>
      
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      
      
  </div>
