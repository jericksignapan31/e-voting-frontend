      <div class="custom_input">
        <button class="addBtn" routerLink="/layout/addstudent">Add</button>
        <div class="custom_input">

            <path
              d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"

    <table
  mat-table
  [dataSource]="students"
  class="mat-elevation-z8"
  style="width: 100%;"
>
  <ng-container *ngFor="let column of displayedColumns">
    <ng-container [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef>{{ column | titlecase }}</th>
      <td mat-cell *matCellDef="let student">{{ student[column] }}</td>
    </ng-container>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let student">
      <button mat-button (click)="editStudent(student)" class="editBtn">Edit</button>
      <button mat-button (click)="deleteStudent(student)" class="deleteBtn">Archived</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns.concat(['actions'])"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns.concat(['actions'])"></tr>
</table>

  </div>
